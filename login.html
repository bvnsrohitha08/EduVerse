<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — EduVerse</title>
    <meta name="description" content="Log in to EduVerse as a Student or Teacher and enter your virtual classroom." />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
        (function () { var t = localStorage.getItem('eduverse-theme'); if (t) document.documentElement.setAttribute('data-theme', t); })();
    </script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">Edu<span>Verse</span></a>
        <div class="navbar-actions">
            <button class="theme-toggle" aria-label="Toggle theme">
                <span class="icon">🌙</span>
                <span class="label">Dark Mode</span>
            </button>
        </div>
    </nav>

    <!-- Login Page -->
    <div class="auth-page" id="login-page">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">Edu<span>Verse</span></div>
            <p class="auth-subtitle">Welcome back! Sign in to continue learning.</p>

            <!-- Role Tabs -->
            <div class="role-tabs" id="role-tabs" role="tablist">
                <button class="role-tab active" id="tab-student" data-role="student" role="tab" aria-selected="true">
                    🎓 Student
                </button>
                <button class="role-tab" id="tab-teacher" data-role="teacher" role="tab" aria-selected="false">
                    👩‍🏫 Teacher
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password" required />
                </div>

                <!-- Error message area -->
                <div class="form-error" id="login-error" role="alert"></div>

                <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                    Sign In →
                </button>
            </form>

            <div class="auth-switch">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>

            <!-- Demo credentials note -->
            <div
                style="margin-top:20px;padding:14px;background:var(--bg-primary);border-radius:12px;border:1px dashed var(--border-color);font-size:0.8rem;color:var(--text-muted);text-align:center;line-height:1.6;">
                💡 <strong>First time?</strong> Create an account via <a href="signup.html"
                    style="color:var(--color-primary)">Sign Up</a> then log in here.
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // ── Parse role from URL query string (?role=student|teacher) ──
        var params = new URLSearchParams(window.location.search);
        var roleHint = params.get('role') || 'student';

        // Expose active role globally so auth.js fallback can read it
        window._activeLoginRole = roleHint;

        // Set initial tab state
        function setTab(role) {
            window._activeLoginRole = role;  // keep in sync with auth.js fallback
            document.querySelectorAll('.role-tab').forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.role === role);
                btn.setAttribute('aria-selected', btn.dataset.role === role);
            });
        }
        setTab(roleHint);

        // Tab click
        document.getElementById('role-tabs').addEventListener('click', function (e) {
            var btn = e.target.closest('.role-tab');
            if (btn) setTab(btn.dataset.role);
        });

        // ── Form submit ──────────────────────────────────────────────
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('login-error');
            var btn = document.getElementById('login-btn');

            // Clear previous errors
            errorEl.classList.remove('show');
            errorEl.textContent = '';

            if (!email || !password) {
                errorEl.textContent = 'Please enter both email and password.';
                errorEl.classList.add('show');
                return;
            }

            // Show loading state
            btn.textContent = 'Signing in…';
            btn.disabled = true;

            try {
                await loginUser(email, password);
                // loginUser() handles redirect internally
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.add('show');
                btn.textContent = 'Sign In →';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
